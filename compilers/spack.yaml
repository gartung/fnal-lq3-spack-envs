# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - gcc@15+graphite+nvptx ^cuda@13
  - gcc@14+graphite+nvptx ^cuda@13
  - gcc@13+graphite+nvptx ^cuda@13
  - nvhpc+lapack+mpi
  view: false
  concretizer:
    unify: false
  packages:
    all:
      target:
        - x86_64_v2
